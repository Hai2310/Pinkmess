services:
  - type: web
    name: pinkmess-bunny-edition
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://pinkmess-bunny-edition.onrender.com/api/auth/google/callback
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: TURN_KEY_ID
        sync: false
      - key: TURN_KEY_API_TOKEN
        sync: false
